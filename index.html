<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arduino LCD Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.8;
    }
    section {
      background: white;
      padding: 25px;
      margin: 20px 0;
      border-radius: 12px;
    }
    img { max-width: 100%; border-radius: 8px; }
    h1 { color: #204c85; }
  </style>
</head>
<body>
  <h1>Arduino LCD1602 Custom Character Project</h1>
  <p>아두이노를 활용한 LCD 캐릭터 애니메이션</p>

  <section>
    <h2>1. 프로젝트 소개</h2>
    <p>
      LCD1602의 첫 번째 줄 첫 번째 칸에서
      Custom Character를 활용하여
      부드러운 캐릭터 애니메이션을 구현하였다.
    </p>
  </section>

  <section>
    <h2>2. 회로 연결도</h2>
    <img src="wiring.jpg" alt="회로 연결도">
  </section>

  <section>
    <h2>3. 구현 방법</h2>
    <p>
      아두이노의 Custom Character 기능을
      활용하여 캐릭터의 동작을 표현하였다.
    </p>
  </section>

  <section>
    <h2>4. 동작 사진</h2>
    <img src="demo.jpg" alt="실제 동작 사진">
  </section>

  <section>
    <h2>5. 고찰</h2>
    <p>
      LCD의 제한된 픽셀을 활용하여
      움직임을 구현하는 과정을 학습하였다.
    </p>
  </section>
</body>
</html>
